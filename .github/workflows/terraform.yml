name: Terraform CI/CD Pipeline

on:
  pull_request:
    branches: [dev]
    paths: ['iac-setup/**'] # Only run if changes in iac-setup folder
  push:
    branches:
      - dev
      - stage
      - prod
    paths: ['iac-setup/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform_plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Terraform Plan (PR Validation)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        working-directory: ./iac-setup
        run: terraform init

      - name: Terraform Validate
        working-directory: ./iac-setup
        run: terraform validate

      - name: Check Terraform Formatting
        working-directory: ./iac-setup
        run: terraform fmt -check

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v3
        with:
          version: 0.46.0

      - name: Run TFLint
        working-directory: ./iac-setup
        run: tflint --config .tflint.hcl || echo "TFLint warnings"

      - name: tfsec (Security Scan)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working-directory: ./iac-setup

      - name: Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./iac-setup

      - name: Infracost (Cost Estimation)
        uses: infracost/actions/setup@v2

      - run: infracost breakdown --path=./iac-setup --terraform-var-file=dev.tfvars

      - name: Terraform Plan
        working-directory: ./iac-setup
        run: terraform plan -var-file=dev.tfvars

  terraform_apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Terraform Apply (Dev/Stage/Prod)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ./iac-setup
        run: terraform init

      - name: Terraform Apply or Destroy
        working-directory: ./iac-setup
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform destroy -auto-approve -var-file=$(basename $GITHUB_REF).tfvars || terraform destroy -auto-approve -var-file=dev.tfvars
          else
            terraform apply -auto-approve -var-file=$(basename $GITHUB_REF).tfvars || terraform apply -auto-approve -var-file=dev.tfvars
          fi

      - name: Create Tag for Prod
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="prod-$(date +'%Y%m%d%H%M%S')"
          git tag $TAG
          git push origin $TAG
